<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matthew's Hub - Arcade</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff007f;
            --neon-green: #00ff88;
            --neon-orange: #ffaa00;
            --neon-purple: #bc13fe;
            --bg-dark: #050510;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
            touch-action: none;
        }

        /* --- NAVIGATION & HUB --- */
        #main-menu {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #101030 0%, #050510 100%);
            z-index: 100;
        }

        .hub-title {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: white;
            text-shadow: 0 0 20px var(--neon-blue);
            margin-bottom: 40px;
            text-align: center;
        }

        .game-card-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-card {
            width: 180px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--neon-blue);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .game-card:hover {
            transform: translateY(-10px);
            background: rgba(0, 242, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
        }

        .game-card.math { border-color: var(--neon-pink); }
        .game-card.math:hover { box-shadow: 0 0 30px rgba(255, 0, 127, 0.3); }
        
        .game-card.clicker { border-color: var(--neon-orange); }
        .game-card.clicker:hover { box-shadow: 0 0 30px rgba(255, 170, 0, 0.3); }

        .game-card h2 { margin: 10px 0; font-size: 1.2rem; }
        .game-card p { font-size: 0.8rem; color: #8af; }

        #back-to-menu {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 200;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid white;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            display: none;
        }

        #audio-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 200;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid white;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* --- SHARED UI --- */
        .hidden { display: none !important; }
        .screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 5, 20, 0.95);
            padding: 30px;
            border-radius: 24px;
            border: 2px solid white;
            backdrop-filter: blur(25px);
            z-index: 150;
            width: 420px;
            text-align: center;
            max-width: 90vw;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        button.action-btn {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            border: none;
            padding: 12px 30px;
            color: white;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* --- COOKIE CLICKER UI --- */
        #clicker-ui {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            background: #050515;
        }
        .clicker-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
        }
        .clicker-shop {
            width: 320px;
            padding: 20px;
            background: rgba(0,0,0,0.4);
            overflow-y: auto;
            border-left: 1px solid rgba(0, 242, 255, 0.2);
        }
        #big-cookie {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #ffaa00 0%, #aa6600 100%);
            border-radius: 50%;
            cursor: pointer;
            border: 8px solid white;
            box-shadow: 0 0 30px var(--neon-orange);
            transition: transform 0.05s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            user-select: none;
        }
        #big-cookie:active { transform: scale(0.92); }
        .stat-val { font-size: 2.5rem; color: var(--neon-orange); font-weight: bold; margin-bottom: 5px; text-shadow: 0 0 10px rgba(255, 170, 0, 0.5); }
        .stat-label { color: #888; text-transform: uppercase; letter-spacing: 2px; font-size: 0.8rem; }
        
        .shop-item {
            background: rgba(255,255,255,0.03);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .shop-item:hover:not(.disabled) { background: rgba(255,255,255,0.08); border-color: var(--neon-orange); transform: translateX(-5px); }
        .shop-item.disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
        .shop-item h4 { margin: 0; color: var(--neon-orange); font-size: 1rem; }
        .shop-item p { margin: 5px 0; font-size: 0.75rem; color: #aaa; line-height: 1.2; }
        .shop-cost { font-weight: bold; color: var(--neon-green); font-size: 0.9rem; margin-top: 5px; }
        .owned-tag { position: absolute; top: 10px; right: 10px; font-size: 0.7rem; color: var(--neon-blue); font-weight: bold; }

        #save-status {
            font-size: 0.7rem;
            color: var(--neon-green);
            opacity: 0;
            transition: opacity 0.5s;
            margin-bottom: 10px;
        }

        .welcome-back {
            background: rgba(0, 242, 255, 0.1);
            border: 1px solid var(--neon-blue);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .level-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0; min-height: 200px; }
        .level-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 15px; border-radius: 12px; cursor: pointer; text-align: left; transition: 0.2s; }
        .level-btn:hover { border-color: var(--neon-blue); background: rgba(0, 242, 255, 0.1); }

        canvas { display: block; }
    </style>
</head>
<body>

    <button id="back-to-menu">BACK TO HUB</button>
    <button id="audio-toggle">SOUND: OFF</button>

    <div id="main-menu">
        <h1 class="hub-title">MATTHEW'S HUB</h1>
        <div class="game-card-container">
            <div class="game-card" id="card-wave">
                <h2>NEON WAVE</h2>
                <p>Avoid walls. Master the gravity pulse.</p>
            </div>
            <div class="game-card math" id="card-math">
                <h2>MATH DASH</h2>
                <p>Solve quickly. Don't drain the energy.</p>
            </div>
            <div class="game-card clicker" id="card-clicker">
                <h2>COOKIE CRUNCH</h2>
                <p>Click the neon cookie. Buy upgrades.</p>
            </div>
        </div>
    </div>

    <div id="wave-level-select" class="screen hidden">
        <h2 style="color: var(--neon-blue); margin-top: 0;">SELECT LEVEL</h2>
        <div class="level-grid" id="level-grid-container"></div>
        <button class="action-btn" id="close-level-select" style="background: #333; margin-top: 20px;">Back</button>
    </div>

    <div id="wave-ui" class="hidden">
        <div id="wave-level-display" style="position: absolute; top: 20px; left: 120px; font-size: 1.2rem; color: var(--neon-blue);">Level: 1</div>
        <div id="wave-score-container" style="position: absolute; top: 20px; right: 120px; font-size: 2rem; opacity: 0.5;">0</div>
        <div id="wave-over" class="screen hidden">
            <h1 style="color: var(--neon-pink)">CRASHED</h1>
            <button class="action-btn" id="wave-retry">Retry</button>
        </div>
    </div>

    <div id="math-ui" class="hidden">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none;">
            <div id="math-problem" style="font-size: 4rem; margin-bottom: 20px;">? + ?</div>
            <input type="number" id="math-input" style="pointer-events: auto; background: black; border: 2px solid var(--neon-pink); color: white; font-size: 2rem; text-align: center; width: 150px; border-radius: 10px;">
        </div>
        <div id="math-over" class="screen hidden">
            <h1>TIME OUT</h1>
            <button class="action-btn" id="math-retry">Retry</button>
        </div>
    </div>

    <div id="clicker-ui" class="hidden">
        <div class="clicker-main">
            <div id="away-message-container"></div>
            <div class="stat-label">Total Crumbs</div>
            <div id="cookie-count" class="stat-val">0</div>
            <div class="stat-label">Production: <span id="cps-val" style="color: var(--neon-green)">0</span> / sec</div>
            <div id="big-cookie" style="margin-top: 40px;">🍪</div>
        </div>
        <div class="clicker-shop">
            <h2 style="color: var(--neon-orange); font-size: 1.2rem;">SHOP</h2>
            <div id="save-status">Progress Saved!</div>
            <div id="shop-container"></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // --- GAME STATE ---
        let activeGame = null;
        let isPlaying = false;
        let keys = {};

        // --- AUDIO ---
        const AudioEngine = {
            ctx: null, masterGain: null, isMuted: true,
            init() {
                if (this.ctx) return;
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.2;
                this.masterGain.connect(this.ctx.destination);
            },
            toggleMute() {
                this.init();
                this.isMuted = !this.isMuted;
                document.getElementById('audio-toggle').innerText = `SOUND: ${this.isMuted ? 'OFF' : 'ON'}`;
            },
            playNote(freq, type, duration) {
                if (this.isMuted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                g.gain.setValueAtTime(0.1, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                osc.connect(g); g.connect(this.masterGain);
                osc.start(); osc.stop(this.ctx.currentTime + duration);
            }
        };

        // --- HUB NAVIGATION ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const backBtn = document.getElementById('back-to-menu');
        const mainMenu = document.getElementById('main-menu');

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        document.getElementById('audio-toggle').onclick = () => AudioEngine.toggleMute();
        
        document.getElementById('card-wave').onclick = () => {
            mainMenu.classList.add('hidden');
            document.getElementById('wave-level-select').classList.remove('hidden');
            backBtn.style.display = 'block';
            renderWaveLevels();
        };

        document.getElementById('card-math').onclick = () => switchGame('math');
        document.getElementById('card-clicker').onclick = () => switchGame('clicker');

        document.getElementById('close-level-select').onclick = () => {
            document.getElementById('wave-level-select').classList.add('hidden');
            mainMenu.classList.remove('hidden');
            backBtn.style.display = 'none';
        };

        backBtn.onclick = () => {
            if (activeGame === 'clicker') saveLocalData();
            activeGame = null; isPlaying = false;
            mainMenu.classList.remove('hidden');
            backBtn.style.display = 'none';
            ['wave-ui','math-ui','clicker-ui','wave-level-select'].forEach(id => document.getElementById(id).classList.add('hidden'));
        };

        function switchGame(mode, data = null) {
            activeGame = mode;
            mainMenu.classList.add('hidden');
            backBtn.style.display = 'block';
            document.getElementById(`${mode}-ui`).classList.remove('hidden');
            if (mode === 'wave') startWave(data);
            if (mode === 'math') startMath();
            if (mode === 'clicker') startClicker();
        }

        // --- COOKIE CLICKER ---
        let cookies = 0;
        let totalCookiesEarned = 0;
        let cps = 0;
        let clickPower = 1;

        const shopItems = [
            { id: 'clicker', name: 'Mega-Click', cost: 10, baseCps: 0, power: 1, owned: 0, unlocked: true, desc: '+1 Click Power' },
            { id: 'baker', name: 'Auto-Baker', cost: 15, baseCps: 1, power: 0, owned: 0, unlocked: true, desc: 'Bakes 1 cookie/sec' },
            { id: 'oven', name: 'Neon Oven', cost: 100, baseCps: 8, power: 0, owned: 0, unlocked: true, desc: 'Bakes 8 cookies/sec' },
            { id: 'factory', name: 'Cookie Factory', cost: 1100, baseCps: 45, power: 0, owned: 0, unlocked: true, desc: 'Mass production!' }
        ];

        function startClicker() {
            loadLocalData();
            isPlaying = true;
            renderShop();
            updateClickerUI();
        }

        document.getElementById('big-cookie').onclick = () => {
            cookies += clickPower;
            totalCookiesEarned += clickPower;
            AudioEngine.playNote(600, 'sine', 0.1);
            updateClickerUI();
        };

        function renderShop() {
            const container = document.getElementById('shop-container');
            container.innerHTML = '';
            shopItems.forEach(item => {
                const div = document.createElement('div');
                div.className = `shop-item ${cookies < item.cost ? 'disabled' : ''}`;
                div.innerHTML = `
                    <div class="owned-tag">${item.owned}</div>
                    <h4>${item.name}</h4>
                    <p>${item.desc}</p>
                    <div class="shop-cost">Cost: ${Math.floor(item.cost)}</div>
                `;
                div.onclick = () => {
                    if (cookies >= item.cost) {
                        cookies -= item.cost;
                        item.owned++;
                        item.cost *= 1.2;
                        calculateStats();
                        renderShop();
                        updateClickerUI();
                        saveLocalData();
                    }
                };
                container.appendChild(div);
            });
        }

        function calculateStats() {
            cps = shopItems.reduce((acc, i) => acc + (i.owned * (i.baseCps || 0)), 0);
            clickPower = 1 + shopItems.reduce((acc, i) => acc + (i.owned * (i.power || 0)), 0);
        }

        function updateClickerUI() {
            document.getElementById('cookie-count').innerText = Math.floor(cookies).toLocaleString();
            document.getElementById('cps-val').innerText = cps.toFixed(1);
            const items = document.querySelectorAll('.shop-item');
            shopItems.forEach((item, idx) => {
                if (items[idx]) {
                    if (cookies < item.cost) items[idx].classList.add('disabled');
                    else items[idx].classList.remove('disabled');
                }
            });
        }

        function saveLocalData() {
            const data = { cookies, totalCookiesEarned, shopItems, lastSaved: Date.now() };
            localStorage.setItem('matthews_hub_save', JSON.stringify(data));
            const status = document.getElementById('save-status');
            status.style.opacity = 1; setTimeout(() => status.style.opacity = 0, 1000);
        }

        function loadLocalData() {
            const saved = localStorage.getItem('matthews_hub_save');
            if (saved) {
                const data = JSON.parse(saved);
                cookies = data.cookies;
                totalCookiesEarned = data.totalCookiesEarned;
                data.shopItems.forEach((savedItem, i) => {
                    if (shopItems[i]) {
                        shopItems[i].owned = savedItem.owned;
                        shopItems[i].cost = savedItem.cost;
                    }
                });
                calculateStats();
            }
        }

        // --- NEON WAVE ---
        let player = {}, walls = [], waveLvl;
        const WAVE_LEVELS = [
            { id: 1, speed: 5, gap: 300, color: '#00f2ff' },
            { id: 2, speed: 7, gap: 250, color: '#ff007f' },
            { id: 3, speed: 10, gap: 200, color: '#00ff88' }
        ];

        function renderWaveLevels() {
            const container = document.getElementById('level-grid-container');
            container.innerHTML = '';
            WAVE_LEVELS.forEach(lvl => {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.innerHTML = `<strong>LEVEL ${lvl.id}</strong>`;
                btn.style.borderLeft = `5px solid ${lvl.color}`;
                btn.onclick = () => {
                    document.getElementById('wave-level-select').classList.add('hidden');
                    switchGame('wave', lvl);
                };
                container.appendChild(btn);
            });
        }

        function startWave(lvl) {
            waveLvl = lvl; isPlaying = true;
            player = { x: 200, y: canvas.height/2 };
            walls = [{ x: 800, w: 70, top: 200, bottom: 200 + lvl.gap }];
            document.getElementById('wave-over').classList.add('hidden');
        }

        document.getElementById('wave-retry').onclick = () => startWave(waveLvl);

        // --- MATH DASH ---
        let mathEnergy = 100, mathAns;
        function startMath() {
            mathEnergy = 100; isPlaying = true;
            document.getElementById('math-over').classList.add('hidden');
            genMath();
            document.getElementById('math-input').focus();
        }
        function genMath() {
            const n1 = Math.floor(Math.random() * 10) + 1;
            const n2 = Math.floor(Math.random() * 10) + 1;
            mathAns = n1 + n2;
            document.getElementById('math-problem').innerText = `${n1} + ${n2}`;
        }
        document.getElementById('math-input').oninput = (e) => {
            if (parseInt(e.target.value) === mathAns) {
                mathEnergy = Math.min(100, mathEnergy + 15);
                e.target.value = ''; genMath();
                AudioEngine.playNote(800, 'sine', 0.1);
            }
        };
        document.getElementById('math-retry').onclick = () => startMath();

        // --- LOOP ---
        function loop(t) {
            if (isPlaying) {
                if (activeGame === 'wave') {
                    player.x += waveLvl.speed;
                    player.y += (keys[' '] || keys['ArrowUp']) ? -6 : 6;
                    if (player.y < 0 || player.y > canvas.height) { isPlaying = false; document.getElementById('wave-over').classList.remove('hidden'); }
                    walls.forEach(w => {
                        if (player.x > w.x && player.x < w.x + w.w && (player.y < w.top || player.y > w.bottom)) { 
                            isPlaying = false; document.getElementById('wave-over').classList.remove('hidden'); 
                        }
                    });
                    if (player.x > walls[walls.length-1].x - 600) {
                        const x = walls[walls.length-1].x + 400;
                        const top = Math.random() * (canvas.height - waveLvl.gap - 100) + 50;
                        walls.push({ x, w: 70, top, bottom: top + waveLvl.gap });
                    }
                }
                if (activeGame === 'math') {
                    mathEnergy -= 0.15;
                    if (mathEnergy <= 0) { isPlaying = false; document.getElementById('math-over').classList.remove('hidden'); }
                }
                if (activeGame === 'clicker') {
                    cookies += (cps / 60);
                    updateClickerUI();
                }
            }

            ctx.fillStyle = '#050510';
            ctx.fillRect(0,0,canvas.width, canvas.height);

            if (activeGame === 'wave') {
                ctx.save(); ctx.translate(-player.x + 200, 0);
                ctx.fillStyle = waveLvl.color;
                walls.forEach(w => { ctx.fillRect(w.x, 0, w.w, w.top); ctx.fillRect(w.x, w.bottom, w.w, canvas.height); });
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(player.x, player.y, 10, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(loop);
        }

        window.onkeydown = (e) => keys[e.key] = true;
        window.onkeyup = (e) => keys[e.key] = false;
        loop();
    </script>
</body>
</html>
