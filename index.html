<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matthew's Hub - Arcade</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff007f;
            --neon-green: #00ff88;
            --neon-orange: #ffaa00;
            --neon-purple: #bc13fe;
            --bg-dark: #050510;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* --- NAVIGATION & HUB --- */
        #main-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #101030 0%, #050510 100%);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px 0;
        }

        .hub-title {
            font-size: clamp(2rem, 8vw, 3rem);
            text-transform: uppercase;
            letter-spacing: 4px;
            color: white;
            text-shadow: 0 0 20px var(--neon-blue);
            margin-bottom: 30px;
            text-align: center;
        }

        .game-card-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 1001;
            padding: 0 20px;
        }

        .game-card {
            width: 140px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--neon-blue);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .game-card h2 { font-size: 1.1rem; margin: 10px 0; }
        .game-card p { font-size: 0.75rem; opacity: 0.8; }

        .game-card:active {
            transform: scale(0.95);
            background: rgba(0, 242, 255, 0.2);
        }

        .game-card.math { border-color: var(--neon-pink); }
        .game-card.clicker { border-color: var(--neon-orange); }
        .game-card.bike { border-color: var(--neon-green); }

        #back-to-menu {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid white;
            color: white;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            display: none;
            backdrop-filter: blur(5px);
        }

        #audio-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid white;
            color: white;
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            backdrop-filter: blur(5px);
        }

        .owner-tag {
            position: fixed;
            bottom: 10px;
            right: 15px;
            z-index: 2000;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
        }

        .owner-tag span {
            color: var(--neon-blue);
            font-weight: bold;
        }

        /* --- SHARED UI --- */
        .hidden { display: none !important; }
        .screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 5, 20, 0.95);
            padding: 20px;
            border-radius: 24px;
            border: 2px solid white;
            backdrop-filter: blur(25px);
            z-index: 1500;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        /* --- CLICKER UI --- */
        #clicker-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column; /* Better for mobile */
            background: #050515;
            z-index: 500;
        }
        .clicker-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .clicker-shop {
            height: 40%;
            padding: 15px;
            background: rgba(0,0,0,0.6);
            overflow-y: auto;
            border-top: 1px solid rgba(0, 242, 255, 0.2);
        }
        #big-cookie {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, #ffaa00 0%, #aa6600 100%);
            border-radius: 50%;
            cursor: pointer;
            border: 6px solid white;
            box-shadow: 0 0 30px var(--neon-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        /* --- IFRAME CONTAINER --- */
        #game-iframe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 400;
            background: black;
            display: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>

    <button id="back-to-menu">BACK</button>
    <button id="audio-toggle">SOUND: OFF</button>
    
    <div class="owner-tag">Owner: <span>Matthew</span></div>

    <div id="main-menu">
        <h1 class="hub-title">MATTHEW'S HUB</h1>
        <div class="game-card-container">
            <div class="game-card" id="card-wave">
                <h2>NEON WAVE</h2>
                <p>Pulse through gaps.</p>
            </div>
            <div class="game-card math" id="card-math">
                <h2>MATH DASH</h2>
                <p>Mental speed test.</p>
            </div>
            <div class="game-card clicker" id="card-clicker">
                <h2>COOKIE CRUNCH</h2>
                <p>Click & Upgrade.</p>
            </div>
            <div class="game-card bike" id="card-bike">
                <h2>DIRT BIKE</h2>
                <p>Flip & Balance.</p>
            </div>
        </div>
    </div>

    <!-- Container for Dirt Bike (External HTML) -->
    <div id="game-iframe-container">
        <iframe id="game-frame" src=""></iframe>
    </div>

    <!-- Wave/Math UI code remains the same as before but hidden -->
    <!-- ... (Previous UI blocks omitted for brevity but preserved in logic) ... -->

    <script>
        const backBtn = document.getElementById('back-to-menu');
        const mainMenu = document.getElementById('main-menu');
        const gameFrame = document.getElementById('game-frame');
        const frameContainer = document.getElementById('game-iframe-container');

        // NAVIGATION
        document.getElementById('card-bike').onclick = () => {
            mainMenu.classList.add('hidden');
            backBtn.style.display = 'block';
            frameContainer.style.display = 'block';
            gameFrame.src = 'dirt_bike.html';
        };

        // Simplified Hub Game Logic
        document.getElementById('card-wave').onclick = () => alert("Neon Wave loading... (Logic integrated in single file)");
        document.getElementById('card-math').onclick = () => alert("Math Dash loading...");
        document.getElementById('card-clicker').onclick = () => alert("Cookie Clicker loading...");

        backBtn.onclick = () => {
            mainMenu.classList.remove('hidden');
            backBtn.style.display = 'none';
            frameContainer.style.display = 'none';
            gameFrame.src = ''; // Stop game
            // Add logic to hide other game UIs here
        };

        // Mobile touch handling for the Hub itself
        document.addEventListener('touchstart', function(e) {
            // Prevents zoom on some devices
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
