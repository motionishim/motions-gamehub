<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matthew's Hub - Arcade</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff007f;
            --neon-green: #00ff88;
            --neon-orange: #ffaa00;
            --neon-purple: #bc13fe;
            --bg-dark: #050510;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: white;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* --- NAVIGATION & HUB --- */
        #main-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #101030 0%, #050510 100%);
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .hub-title {
            font-size: clamp(2rem, 10vw, 3.5rem);
            text-transform: uppercase;
            letter-spacing: 4px;
            color: white;
            text-shadow: 0 0 20px var(--neon-blue);
            margin-bottom: 30px;
            text-align: center;
        }

        .game-card-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 1001;
            width: 100%;
            max-width: 600px;
        }

        .game-card {
            flex: 1 1 140px;
            min-width: 140px;
            max-width: 200px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--neon-blue);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            backdrop-filter: blur(10px);
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }

        .game-card:active {
            transform: scale(0.95);
            background: rgba(0, 242, 255, 0.2);
        }

        .game-card h2 { font-size: 1rem; margin: 10px 0; }
        .game-card p { font-size: 0.7rem; opacity: 0.7; margin: 0; }

        .game-card.math { border-color: var(--neon-pink); }
        .game-card.clicker { border-color: var(--neon-orange); }

        #back-to-menu {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid white;
            color: white;
            padding: 10px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            display: none;
            backdrop-filter: blur(5px);
        }

        #audio-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid white;
            color: white;
            padding: 10px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            backdrop-filter: blur(5px);
        }

        .owner-tag {
            position: fixed;
            bottom: 10px;
            right: 15px;
            z-index: 2000;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
        }

        /* --- SHARED UI --- */
        .hidden { display: none !important; }
        .screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(5, 5, 20, 0.95);
            padding: 20px;
            border-radius: 24px;
            border: 2px solid white;
            backdrop-filter: blur(25px);
            z-index: 1500;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        button.action-btn {
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            border: none;
            padding: 15px;
            color: white;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* --- COOKIE CLICKER MOBILE UI --- */
        #clicker-ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column; /* Stacked for mobile */
            background: #050515;
            z-index: 500;
        }
        .clicker-main {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .clicker-shop {
            flex: 1;
            padding: 15px;
            background: rgba(0,0,0,0.6);
            overflow-y: auto;
            border-top: 1px solid rgba(0, 242, 255, 0.2);
        }
        #big-cookie {
            width: clamp(140px, 40vw, 200px);
            height: clamp(140px, 40vw, 200px);
            background: radial-gradient(circle, #ffaa00 0%, #aa6600 100%);
            border-radius: 50%;
            cursor: pointer;
            border: 6px solid white;
            box-shadow: 0 0 30px var(--neon-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        .level-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .level-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 12px; border-radius: 12px; text-align: left; }

        #math-input {
            background: black;
            border: 2px solid var(--neon-pink);
            color: white;
            font-size: 1.5rem;
            text-align: center;
            width: 120px;
            border-radius: 10px;
            padding: 10px;
            margin-top: 20px;
        }

        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>

    <button id="back-to-menu">BACK</button>
    <button id="audio-toggle">SOUND: OFF</button>
    
    <div class="owner-tag">Owner: <span>Matthew</span></div>

    <!-- Main Hub -->
    <div id="main-menu">
        <h1 class="hub-title">MATTHEW'S HUB</h1>
        <div class="game-card-container">
            <div class="game-card" id="card-wave">
                <h2>NEON WAVE</h2>
                <p>Pulse through gaps.</p>
            </div>
            <div class="game-card math" id="card-math">
                <h2>MATH DASH</h2>
                <p>Fast math dash.</p>
            </div>
            <div class="game-card clicker" id="card-clicker">
                <h2>COOKIE CRUNCH</h2>
                <p>Click & Upgrade.</p>
            </div>
        </div>
    </div>

    <!-- Wave UI -->
    <div id="wave-level-select" class="screen hidden">
        <h2 style="color: var(--neon-blue); margin-top: 0;">SELECT LEVEL</h2>
        <div class="level-grid" id="level-grid-container"></div>
        <button class="action-btn" id="close-level-select" style="background: #333;">Close</button>
    </div>

    <div id="wave-ui" class="hidden">
        <div id="wave-score-container" style="position: absolute; top: 20px; right: 20px; font-size: 1.5rem; pointer-events: none; z-index: 101;">0</div>
        <div id="wave-over" class="screen hidden" style="pointer-events: auto;">
            <h1 style="color: var(--neon-pink)">CRASHED</h1>
            <button class="action-btn" id="wave-retry">Retry</button>
        </div>
    </div>

    <!-- Math UI -->
    <div id="math-ui" class="hidden">
        <div style="position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 101; pointer-events: none; width: 100%;">
            <div id="math-problem" style="font-size: 3rem; text-shadow: 0 0 10px white;">? + ?</div>
            <input type="number" id="math-input" style="pointer-events: auto;">
        </div>
        <div id="math-over" class="screen hidden" style="pointer-events: auto;">
            <h1 style="color: var(--neon-pink)">TIME OUT</h1>
            <button class="action-btn" id="math-retry">Retry</button>
        </div>
    </div>

    <!-- Clicker UI -->
    <div id="clicker-ui" class="hidden">
        <div class="clicker-main">
            <div id="cookie-count" style="font-size: 2.5rem; color: var(--neon-orange); font-weight: bold;">0</div>
            <div style="font-size: 0.8rem; opacity: 0.6; margin-bottom: 20px;">CRUMBS</div>
            <div id="big-cookie">🍪</div>
        </div>
        <div class="clicker-shop">
            <div id="shop-container"></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const backBtn = document.getElementById('back-to-menu');
        const mainMenu = document.getElementById('main-menu');
        
        let activeGame = null;
        let isPlaying = false;
        let keys = {};
        let touchActive = false;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio Engine
        const AudioEngine = {
            ctx: null, isMuted: true,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            toggleMute() { this.init(); this.isMuted = !this.isMuted; document.getElementById('audio-toggle').innerText = `SOUND: ${this.isMuted ? 'OFF' : 'ON'}`; },
            playNote(freq, dur) {
                if (this.isMuted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.frequency.value = freq;
                g.gain.setValueAtTime(0.1, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
                osc.connect(g); g.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + dur);
            }
        };
        document.getElementById('audio-toggle').onclick = () => AudioEngine.toggleMute();

        // Navigation
        document.getElementById('card-wave').onclick = () => {
            mainMenu.classList.add('hidden');
            document.getElementById('wave-level-select').classList.remove('hidden');
            backBtn.style.display = 'block';
            renderWaveLevels();
        };
        document.getElementById('card-math').onclick = () => switchGame('math');
        document.getElementById('card-clicker').onclick = () => switchGame('clicker');

        function switchGame(mode) {
            activeGame = mode;
            mainMenu.classList.add('hidden');
            backBtn.style.display = 'block';
            document.getElementById(`${mode}-ui`).classList.remove('hidden');
            if (mode === 'math') startMath();
            if (mode === 'clicker') startClicker();
        }

        backBtn.onclick = () => {
            activeGame = null; isPlaying = false;
            mainMenu.classList.remove('hidden');
            backBtn.style.display = 'none';
            document.querySelectorAll('.screen, #wave-ui, #math-ui, #clicker-ui').forEach(el => el.classList.add('hidden'));
        };

        // Neon Wave Logic
        let player = { x: 0, y: 0, trail: [] }, walls = [], score = 0, currentLvl = null;
        const WAVE_LEVELS = [
            { id: 1, speed: 4, gap: 300, color: '#00f2ff' },
            { id: 2, speed: 5, gap: 280, color: '#ff007f' },
            { id: 3, speed: 6, gap: 250, color: '#00ff88' },
            { id: 4, speed: 7, gap: 220, color: '#ffaa00' }
        ];

        function renderWaveLevels() {
            const container = document.getElementById('level-grid-container');
            container.innerHTML = '';
            WAVE_LEVELS.forEach(lvl => {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.innerHTML = `LEVEL ${lvl.id}<br><small>${lvl.speed} Speed</small>`;
                btn.onclick = () => {
                    document.getElementById('wave-level-select').classList.add('hidden');
                    startWave(lvl);
                };
                container.appendChild(btn);
            });
        }

        function startWave(lvl) {
            currentLvl = lvl; activeGame = 'wave'; isPlaying = true;
            score = 0; player = { x: 100, y: canvas.height/2, trail: [] };
            walls = []; for(let i=0; i<3; i++) spawnWall(600 + i * 400);
            document.getElementById('wave-ui').classList.remove('hidden');
            document.getElementById('wave-over').classList.add('hidden');
        }

        function spawnWall(x) {
            const top = Math.random() * (canvas.height - currentLvl.gap - 100) + 50;
            walls.push({ x, w: 60, top, bottom: top + currentLvl.gap });
        }

        document.getElementById('wave-retry').onclick = () => startWave(currentLvl);

        // Math Dash Logic
        let mathEnergy = 100, mathAns = 0;
        function startMath() { mathEnergy = 100; isPlaying = true; document.getElementById('math-over').classList.add('hidden'); genMath(); document.getElementById('math-input').value = ''; }
        function genMath() { const n1 = Math.floor(Math.random()*10)+1, n2 = Math.floor(Math.random()*10)+1; mathAns = n1+n2; document.getElementById('math-problem').innerText = `${n1} + ${n2}`; }
        document.getElementById('math-input').oninput = (e) => { if(parseInt(e.target.value) === mathAns) { mathEnergy = Math.min(100, mathEnergy+20); e.target.value = ''; genMath(); AudioEngine.playNote(800, 0.1); }};
        document.getElementById('math-retry').onclick = () => startMath();

        // Cookie Clicker
        let cookies = 0, clickPower = 1;
        function startClicker() { isPlaying = true; renderShop(); }
        document.getElementById('big-cookie').onclick = () => { cookies += clickPower; AudioEngine.playNote(400, 0.05); updateClickerUI(); };
        function updateClickerUI() { document.getElementById('cookie-count').innerText = Math.floor(cookies); }
        function renderShop() {
            const shop = document.getElementById('shop-container');
            shop.innerHTML = `<button class="action-btn" style="width:100%" onclick="buyUpgrade()">Upgrade Click (${clickPower*10} Crumbs)</button>`;
        }
        window.buyUpgrade = () => {
            const cost = clickPower * 10;
            if (cookies >= cost) { cookies -= cost; clickPower++; renderShop(); updateClickerUI(); }
        };

        // Game Loop
        function loop() {
            ctx.fillStyle = '#050510'; ctx.fillRect(0,0,canvas.width, canvas.height);
            
            if (isPlaying && activeGame === 'wave') {
                const up = keys[' '] || touchActive;
                player.x += currentLvl.speed;
                player.y += up ? -5 : 5;
                player.trail.push({x: player.x, y: player.y});
                if(player.trail.length > 20) player.trail.shift();

                if(player.y < 0 || player.y > canvas.height) dieWave();
                walls.forEach(w => {
                    if(player.x+10 > w.x && player.x-10 < w.x+w.w) {
                        if(player.y-10 < w.top || player.y+10 > w.bottom) dieWave();
                    }
                });
                if(player.x > walls[0].x + 100) { walls.shift(); spawnWall(walls[walls.length-1].x + 400); score++; document.getElementById('wave-score-container').innerText = score; }

                ctx.save(); ctx.translate(-player.x + 100, 0);
                ctx.fillStyle = currentLvl.color;
                walls.forEach(w => { ctx.fillRect(w.x, 0, w.w, w.top); ctx.fillRect(w.x, w.bottom, w.w, canvas.height); });
                ctx.strokeStyle = 'white'; ctx.lineWidth = 3; ctx.beginPath();
                player.trail.forEach((p, i) => { if(i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
                ctx.stroke();
                ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(player.x, player.y, 10, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }

            if (isPlaying && activeGame === 'math') {
                mathEnergy -= 0.15;
                if(mathEnergy <= 0) { isPlaying = false; document.getElementById('math-over').classList.remove('hidden'); }
                ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(canvas.width/2-100, 40, 200, 15);
                ctx.fillStyle = varName('--neon-pink'); ctx.fillRect(canvas.width/2-100, 40, (mathEnergy/100)*200, 15);
            }

            requestAnimationFrame(loop);
        }

        function dieWave() { isPlaying = false; document.getElementById('wave-over').classList.remove('hidden'); }
        function varName(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

        // Input Handlers
        window.onkeydown = (e) => keys[e.key] = true;
        window.onkeyup = (e) => keys[e.key] = false;
        window.ontouchstart = (e) => { 
            if (activeGame === 'wave') { e.preventDefault(); touchActive = true; }
        };
        window.ontouchend = () => touchActive = false;

        loop();
    </script>
</body>
</html>
